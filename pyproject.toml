[project]
name = "project1-cifar10-resnet"
version = "0.1.0"
description = "From-scratch compact ResNet for the NYU Deep Learning Project 1 competition"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "numpy==2.5.2",
    "pillow==12.3.0",
    "matplotlib==3.11.2",
    "kagglehub==1.0.3",
    "kaggle==2.2.5",
]

[project.optional-dependencies]
notebook = ["ipykernel>=6.29,<8"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
